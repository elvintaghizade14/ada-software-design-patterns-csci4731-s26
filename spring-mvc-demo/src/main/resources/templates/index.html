<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Storefront</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .product-card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 300px;
        }
        h2 { color: #333; margin-top: 0; }
        .price { font-size: 1.5rem; color: #28a745; font-weight: bold; margin: 15px 0; }
        button {
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
        }
        button:hover { background: #0056b3; }
        .error { color: #dc3545; display: none; margin-top: 15px; }
    </style>
</head>
<body>

<div class="product-card">
    <h2>Product Details</h2>
    <div id="product-info">
        <p style="color: #666;">Click the button to fetch data from the Spring Boot API.</p>
    </div>
    <button id="fetch-btn">Fetch Product #1</button>
    <p id="error-msg" class="error">Could not connect to API. Is Spring Boot running?</p>
</div>

<script>
    document.getElementById('fetch-btn').addEventListener('click', () => {
        const productInfo = document.getElementById('product-info');
        const errorMsg = document.getElementById('error-msg');

        // This is the View calling the Waiter (Controller)
        fetch('http://localhost:8080/api/products/1')
            .then(response => {
                if (!response.ok) throw new Error('Network response was not ok');
                return response.json(); // The Waiter hands back JSON data
            })
            .then(data => {
                // Updating the View with the pure data (DTO)
                errorMsg.style.display = 'none';
                productInfo.innerHTML = `
                        <h3>${data.name}</h3>
                        <p class="price">$${data.price}</p>
                        <p style="font-size: 0.8rem; color: #888;">Product ID: ${data.id}</p>
                    `;
            })
            .catch(error => {
                console.error('Error fetching data:', error);
                errorMsg.style.display = 'block';
            });
    });
</script>
</body>
</html>
